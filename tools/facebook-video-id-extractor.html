<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facebook Video ID Extractor</title><meta name="description" content="Find the video ID in any Facebook video URL."><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{--bg:#f0f2f5;--card:#fff;--ink:#1c1e21;--mut:#606770;--acc:#1877f2;--line:#dddfe2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--acc)}header{background:#1877f2;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header a{color:#fff;text-decoration:none;margin:0 10px;font-size:14px}header b{font-size:20px}
.wrap{max-width:980px;margin:0 auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin:18px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #ccd0d5;font-size:15px;margin:8px 0}
button{background:var(--acc);color:#fff;border:0;padding:12px 22px;border-radius:8px;font-size:16px;cursor:pointer;font-weight:700}
button.sec{background:#e7f3ff;color:var(--acc);border:1px solid var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink)}
.tile img{width:100%;height:140px;object-fit:cover;border-radius:8px}.tile h3{font-size:16px;margin:10px 0 6px}.tile p{font-size:13px;color:var(--mut);margin:0}
.note{background:#fff4d6;border:1px solid #e6c200;border-radius:10px;padding:12px;font-size:14px}
footer{padding:26px 20px;text-align:center;color:var(--mut);font-size:13px}.small{font-size:13px;color:var(--mut)}
h1{font-size:clamp(26px,4vw,38px)}@media(max-width:640px){.wrap{padding:14px}}
</style></head><body>
<header><b>Facebook Transcript</b><nav><a href="/index.html">Home</a><a href="/tools/">Tools</a><a href="/guides/">Guides</a><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/privacy.html">Privacy</a></nav></header>
<main class="wrap"><h1>Facebook Video ID Extractor</h1><p>Find the video ID in any Facebook video URL.</p><div class='card'><input id="u" placeholder="Paste a Facebook video URL"><button onclick="go()">Extract ID</button><div id="out"></div>
<script>function go(){var u=document.getElementById('u').value.trim();var o=document.getElementById('out');if(!u){o.innerHTML='<p>Paste a URL first.</p>';return}var m=u.match(/[?&]v=(\d+)/)||u.match(/\/videos\/(\d+)/)||u.match(/\/reel\/(\d+)/);if(m){o.innerHTML='<p><b>Video ID:</b> '+m[1]+'</p><p>Full watch link: https://www.facebook.com/watch/?v='+m[1]+'</p>'}else if(/fb\.watch/.test(u)){o.innerHTML='<p>This is a short fb.watch link. Open it in a browser to expand it to the full URL, then paste that URL here.</p>'}else{o.innerHTML='<p>No video ID found. A Facebook video URL looks like https://www.facebook.com/watch/?v=1234567890</p>'}}</script></div><p><a href='/index.html'>Back to home</a></p></main>
<footer><p>Facebook Transcript — Free browser tools and practical guides. <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/disclaimer.html">Disclaimer</a> · <a href="/contact.html">Contact</a></p></footer>
</body></html>
